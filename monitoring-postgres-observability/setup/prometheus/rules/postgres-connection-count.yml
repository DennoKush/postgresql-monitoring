groups:
  - name: postgres_connection_count
    interval: 30s
    rules:

      # ---------------------------------------------------------------
      # HighDatabaseConnectionUsage
      # Warning when PostgreSQL connection usage is above 70% of
      # max_connections for a sustained period.
      # ---------------------------------------------------------------
      - alert: HighDatabaseConnectionUsage
        expr: |
          (
            sum by (instance) (pg_stat_activity_count)
            /
            on(instance)
            pg_settings_max_connections
          ) * 100 > 70
        for: 5m
        labels:
          severity: warning
          team: dba
          component: postgres
        annotations:
          summary: "PostgreSQL connection usage above 70% on {{ $labels.instance }}"
          description: >
            PostgreSQL on {{ $labels.instance }} is using {{ $value | printf "%.1f" }}%
            of max_connections. Sustained high usage reduces connection headroom and may
            eventually cause new connections to fail. Check PgBouncer pool usage, idle
            sessions, connection leaks, slow queries, and application retry behavior before
            increasing max_connections.

      # ---------------------------------------------------------------
      # DatabaseConnectionsNearMax
      # Critical when PostgreSQL connection usage is above 90% of
      # max_connections.
      # ---------------------------------------------------------------
      - alert: DatabaseConnectionsNearMax
        expr: |
          (
            sum by (instance) (pg_stat_activity_count)
            /
            on(instance)
            pg_settings_max_connections
          ) * 100 > 90
        for: 2m
        labels:
          severity: critical
          team: dba
          component: postgres
        annotations:
          summary: "PostgreSQL connections near max_connections on {{ $labels.instance }}"
          description: >
            PostgreSQL on {{ $labels.instance }} is using {{ $value | printf "%.1f" }}%
            of max_connections. New connection attempts may fail if usage reaches 100%.
            Immediate action: check connection storms, idle sessions, PgBouncer pool pressure,
            application retry loops, and long-running queries. Increase max_connections only
            after confirming PostgreSQL has enough memory and CPU headroom.

      # ---------------------------------------------------------------
      # TooManyIdleConnections
      # Warn when idle connections are both high in absolute terms and
      # much higher than active connections.
      # ---------------------------------------------------------------
      - alert: TooManyIdleConnections
        expr: |
          (
            sum by (instance) (pg_stat_activity_count{state="idle"}) > 20
          )
          and
          (
            sum by (instance) (pg_stat_activity_count{state="idle"})
            >
            sum by (instance) (pg_stat_activity_count{state="active"}) * 3
          )
        for: 10m
        labels:
          severity: warning
          team: dba
          component: postgres
        annotations:
          summary: "High idle connection ratio on {{ $labels.instance }}"
          description: >
            PostgreSQL on {{ $labels.instance }} has a sustained high number of idle
            connections compared to active connections. This may indicate oversized
            application pools, connection leaks, or clients holding sessions unnecessarily.
            Review pg_stat_activity, application pool settings, and PgBouncer client behavior.

      # ---------------------------------------------------------------
      # SuddenConnectionSpike
      # Warn when total PostgreSQL connections increase rapidly.
      # ---------------------------------------------------------------
      - alert: SuddenConnectionSpike
        expr: |
          (
            sum by (instance) (pg_stat_activity_count)
            -
            sum by (instance) (pg_stat_activity_count offset 5m)
          ) > 30
        for: 2m
        labels:
          severity: warning
          team: dba
          component: postgres
        annotations:
          summary: "Sudden connection spike detected on {{ $labels.instance }}"
          description: >
            PostgreSQL on {{ $labels.instance }} gained more than 30 connections within
            5 minutes. This may indicate an application restart, retry loop, deployment
            event, connection leak, or connection storm. Monitor whether the connection
            count stabilizes or continues rising.