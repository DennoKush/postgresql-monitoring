groups:
  - name: pgbouncer_pool_exhaustion
    interval: 30s
    rules:

      # ---------------------------------------------------------------
      # PgBouncerClientsWaiting
      # Any waiting client means at least one request could not get a
      # server connection immediately.
      # ---------------------------------------------------------------
      - alert: PgBouncerClientsWaiting
        expr: sum by (instance) (pgbouncer_pools_cl_waiting) > 0
        for: 1m
        labels:
          severity: warning
          team: dba
          component: pgbouncer
        annotations:
          summary: "PgBouncer clients waiting on {{ $labels.instance }}"
          description: >
            PgBouncer on {{ $labels.instance }} has {{ $value | printf "%.0f" }} client(s)
            waiting for a server connection. This indicates pool pressure and may increase
            application query latency. Check SHOW POOLS, active clients, waiting clients,
            slow queries, PostgreSQL max_connections, and application connection behavior
            before increasing pool sizes.

      # ---------------------------------------------------------------
      # PgBouncerClientsWaitingCritical
      # Higher sustained waiting means application latency/timeouts are likely.
      # ---------------------------------------------------------------
      - alert: PgBouncerClientsWaitingCritical
        expr: sum by (instance) (pgbouncer_pools_cl_waiting) > 10
        for: 2m
        labels:
          severity: critical
          team: dba
          component: pgbouncer
        annotations:
          summary: "Critical PgBouncer client wait queue on {{ $labels.instance }}"
          description: >
            PgBouncer on {{ $labels.instance }} has {{ $value | printf "%.0f" }} clients
            waiting for a server connection for more than 2 minutes. Applications may be
            experiencing significant latency or timeouts. Check pool saturation, slow queries,
            PostgreSQL connection limits, and application connection spikes immediately.

      # ---------------------------------------------------------------
      # PgBouncerPoolNearExhaustion
      # Active server connections are approaching configured default_pool_size.
      # ---------------------------------------------------------------
      - alert: PgBouncerPoolNearExhaustion
        expr: |
          (
            sum by (instance, database, user) (pgbouncer_pools_sv_active)
            /
            on(instance) group_left
            pgbouncer_config_default_pool_size
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: dba
          component: pgbouncer
        annotations:
          summary: "PgBouncer pool utilization above 80% for {{ $labels.database }}/{{ $labels.user }} on {{ $labels.instance }}"
          description: >
            The PgBouncer pool for database={{ $labels.database }}, user={{ $labels.user }}
            on {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% utilization.
            Active server connections are approaching default_pool_size. Review active clients,
            waiting clients, slow queries, and PostgreSQL capacity before changing pool settings.

      # ---------------------------------------------------------------
      # PgBouncerMaxClientConnNearLimit
      # Total client connections are approaching PgBouncer max_client_conn.
      # ---------------------------------------------------------------
      - alert: PgBouncerMaxClientConnNearLimit
        expr: |
          (
            sum by (instance) (pgbouncer_pools_cl_active + pgbouncer_pools_cl_waiting)
            /
            on(instance)
            pgbouncer_config_max_client_conn
          ) * 100 > 85
        for: 5m
        labels:
          severity: critical
          team: dba
          component: pgbouncer
        annotations:
          summary: "PgBouncer total client connections near max_client_conn on {{ $labels.instance }}"
          description: >
            PgBouncer on {{ $labels.instance }} is using {{ $value | printf "%.1f" }}%
            of max_client_conn. New application connections may be rejected if this reaches
            100%. Check application connection spikes, connection leaks, client lifecycle,
            and PgBouncer max_client_conn.

      # ---------------------------------------------------------------
      # PgBouncerNoIdleServers
      # Informational early signal only. This can be normal during traffic.
      # ---------------------------------------------------------------
      - alert: PgBouncerNoIdleServers
        expr: |
          (
            sum by (instance, database, user) (pgbouncer_pools_cl_active) > 0
          )
          and
          (
            sum by (instance, database, user) (pgbouncer_pools_sv_idle) == 0
          )
        for: 5m
        labels:
          severity: info
          team: dba
          component: pgbouncer
        annotations:
          summary: "No idle PgBouncer server connections for {{ $labels.database }}/{{ $labels.user }} on {{ $labels.instance }}"
          description: >
            PgBouncer has active clients for database={{ $labels.database }},
            user={{ $labels.user }} on {{ $labels.instance }}, but zero idle server
            connections. This may be normal during active traffic, but it can indicate
            limited spare pool capacity if it persists together with waiting clients.

      # ---------------------------------------------------------------
      # PgBouncerExporterTargetDown
      # Prometheus cannot scrape the exporter target.
      # ---------------------------------------------------------------
      - alert: PgBouncerExporterTargetDown
        expr: up{job="pgbouncer_exporter"} == 0
        for: 2m
        labels:
          severity: critical
          team: dba
          component: pgbouncer
        annotations:
          summary: "pgbouncer_exporter target is down on {{ $labels.instance }}"
          description: >
            Prometheus cannot scrape pgbouncer_exporter on {{ $labels.instance }}.
            Check the pgbouncer-exporter service, host firewall, port 9127, and Prometheus
            target configuration.

      # ---------------------------------------------------------------
      # PgBouncerExporterCannotReachPgBouncer
      # Exporter is up, but it cannot connect to PgBouncer.
      # ---------------------------------------------------------------
      - alert: PgBouncerExporterCannotReachPgBouncer
        expr: pgbouncer_up == 0
        for: 2m
        labels:
          severity: critical
          team: dba
          component: pgbouncer
        annotations:
          summary: "pgbouncer_exporter cannot reach PgBouncer on {{ $labels.instance }}"
          description: >
            pgbouncer_exporter is reachable by Prometheus, but it cannot connect to PgBouncer
            on {{ $labels.instance }}. Check PgBouncer service status, port 6432, exporter
            DATA_SOURCE_NAME, PgBouncer auth_file, stats_users, and userlist.txt.