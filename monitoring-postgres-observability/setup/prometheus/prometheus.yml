global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    cluster: pg18-observability
    site: primary
    service: postgresql

scrape_configs:

  # ---------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: observability-server
          component: prometheus

  # ---------------------------------------------------------------
  # PostgreSQL exporter — PostgreSQL internal metrics
  # ---------------------------------------------------------------
  - job_name: postgres_exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9187']
        labels:
          instance: pg18-primary
          component: postgres
          database_engine: postgresql
          database_version: "18"

  # ---------------------------------------------------------------
  # PgBouncer exporter — PgBouncer pool metrics
  # ---------------------------------------------------------------
  - job_name: pgbouncer_exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9127']
        labels:
          instance: pg18-primary
          component: pgbouncer
          database_engine: postgresql
          database_version: "18"